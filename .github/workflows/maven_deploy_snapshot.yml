# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Make snapshot and deploy

on:
  push:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '0 2 * * *'

jobs:
  publish:
    if: github.repository == 'eclipse-store/store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java for publishing to Maven Central Snapshot Repository
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Make a snapshot from Main branch
        # Snapshots are uploaded one file at a time, each with its checksums and metadata, and Central rate-limits
        # the burst with HTTP 429. Sources jars are left out of snapshots (releases keep them), and the resolver
        # retries a 429 ten times with a growing interval (Retry-After is honoured) instead of three times.
        run: >
          mvn -T 1C -Pdeploy -Pproduction --no-transfer-progress --batch-mode clean deploy -U
          -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Dlicense.skip=true -Denforcer.skip=true
          -Daether.connector.http.retryHandler.count=10
          -Daether.connector.http.retryHandler.interval=10000
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.ORG_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ secrets.ORG_GPG_PRIVATE_KEY }}

      - name: Report JUnit results (dorny - surefire)
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: "GigaMap - Test result without slow"
          path: '**/target/**/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false
