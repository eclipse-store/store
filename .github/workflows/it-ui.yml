# Browser tests of the Vanilla-JS storage viewer (Selenium + Cucumber) with the Chrome that is
# preinstalled on the GitHub-hosted runner, headless. No Selenium container needed.

name: Integration tests (UI)

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [ '**' ]
    paths:
      - 'storage/rest/**'
      - 'integration-tests/ui/**'
      - '.github/workflows/it-ui.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Chrome version on the runner
        run: google-chrome --version
      - name: Align serializer version to matching branch snapshot
        uses: ./.github/actions/align-serializer-version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build reactor dependencies (no tests)
        run: >
          mvn -T 1C -P IT -B clean install -DskipTests -pl integration-tests/ui -am --no-transfer-progress -U
          -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dlicense.skip=true -Denforcer.skip=true
      - name: Run UI tests
        run: >
          mvn -P IT -P gui-tests -B test -pl integration-tests/ui --no-transfer-progress
          -Dgpg.skip=true -Dlicense.skip=true -Denforcer.skip=true
      - name: Upload cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            integration-tests/ui/target/cucumber/
            integration-tests/ui/target/cucumber.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report JUnit results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: "UI results"
          path: 'integration-tests/ui/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
