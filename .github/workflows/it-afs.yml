# Abstract File System backends: every backend runs the shared abstract tests against an emulator or a
# database in Testcontainers (Docker is available on the GitHub-hosted runners).
# fast: on every push / PR that can affect the AFS code. slow (Kafka): nightly. Oracle is parked, see afs/pom.xml.

name: Integration tests (AFS)

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [ '**' ]
    paths:
      - 'afs/**'
      - 'integration-tests/afs/**'
      - 'integration-tests/fixtures/**'
      - 'integration-tests/pom.xml'
      - 'pom.xml'
      - '.github/workflows/it-afs.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  AFS_FAST: >-
    integration-tests/afs/commons,integration-tests/afs/nio,integration-tests/afs/jimfs,
    integration-tests/afs/sql-sqlite,integration-tests/afs/sql-mariadb,integration-tests/afs/sql-postgres,
    integration-tests/afs/cross,integration-tests/afs/aws-s3,integration-tests/afs/aws-dynamodb,
    integration-tests/afs/azure,integration-tests/afs/googlecloud-firestore,integration-tests/afs/redis
  AFS_SLOW: >-
    integration-tests/afs/commons,integration-tests/afs/kafka

jobs:
  afs-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Align serializer version to matching branch snapshot
        uses: ./.github/actions/align-serializer-version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build reactor dependencies (no tests)
        run: >
          mvn -T 1C -P IT -B clean install -DskipTests -pl "$(echo $AFS_FAST | tr -d ' ')" -am --no-transfer-progress -U
          -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dlicense.skip=true -Denforcer.skip=true
      - name: Run AFS tests (fast backends)
        run: >
          mvn -P IT -B test -pl "$(echo $AFS_FAST | tr -d ' ')" --no-transfer-progress
          -Dgpg.skip=true -Dlicense.skip=true -Denforcer.skip=true
      - name: Report JUnit results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: "AFS fast results"
          path: 'integration-tests/afs/**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

  afs-slow:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Align serializer version to matching branch snapshot
        uses: ./.github/actions/align-serializer-version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build reactor dependencies (no tests)
        run: >
          mvn -T 1C -P IT -B clean install -DskipTests -pl "$(echo $AFS_SLOW | tr -d ' ')" -am --no-transfer-progress -U
          -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dlicense.skip=true -Denforcer.skip=true
      - name: Run AFS tests (Kafka)
        run: >
          mvn -P IT -B test -pl "$(echo $AFS_SLOW | tr -d ' ')" --no-transfer-progress
          -Dgpg.skip=true -Dlicense.skip=true -Denforcer.skip=true
      - name: Report JUnit results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: "AFS slow results"
          path: 'integration-tests/afs/**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
