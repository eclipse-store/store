# Test runs log warnings and errors only: a failed graph operation the index repairs must stay visible, routine
# progress would bury it.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
# jVector itself warns on every mapped read where the platform lacks posix_madvise (Windows)
org.slf4j.simpleLogger.log.io.github.jbellis.jvector=error
